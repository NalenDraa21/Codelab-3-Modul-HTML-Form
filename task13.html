<!DOCTYPE html>
<html>
    <head>
        <style>
            /* Memindahkan style ke head agar rapi dan valid */
            table, th, td {
                border: 1px solid rgb(255, 255, 255);
                border-collapse: collapse;
            }
            
            
        </style>
    </head>
    <body>
        <h1 style="text-align: center;">Employee Details</h1>
        
        <table align="center" style="border: none; width: 60%;">
            <tr>
                <td>
                    <form action="/action_page.php">
                        <ol>
                            <li>
                                Personal Information
                                <table class="form-table">
                                    <tr>
                                        <td>Employee Name</td>
                                        <td>Last Name</td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <input type="text" name="fname" id="fname" placeholder="First Name">
                                        </td>
                                        <td>
                                            <input type="text" name="lname" id="lname" placeholder="Last Name">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <label for="strDate">Starting date</label> <br>
                                            <input type="date" name="strDate" id="strDate">
                                        </td>
                                        <td>
                                            <label for="birthdate">Birth Date</label><br>
                                            <input type="date" name="birthdate" id="birthdate">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <label for="EmployeeType">Employee Type</label><br>
                                            <select id="EmployeeType" name="EmployeeType">
                                                <option value="none">Select</option>
                                                <option value="CEO">CEO</option>
                                                <option value="Cleaner">Cleaner</option>
                                            </select>
                                        </td>
                                        <td>
                                            <label for="Gender">Gender</label><br>
                                            <input type="radio" id="male" name="male"> Male
                                            <input type="radio" id="Female" name="Female"> Female
                                        </td>
                                    </tr>
                                </table>
                            </li>
                            <br><br>

                            <li>
                                Location
                                <table class="form-table">
                                    <tr>
                                        <td>City</td>
                                        <td>State</td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <input type="text" id="city" placeholder="City">
                                        </td>
                                        <td>
                                            <input type="text" id="state" placeholder="State">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>ZIP</td>
                                        <td>Address</td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <input type="text" id="zip" placeholder="ZIP">
                                        </td>
                                        <td>
                                            <textarea name="Address" id="Address" placeholder="Address"></textarea>
                                        </td>
                                    </tr>
                                </table>
                            </li>
                            <br><br>

                            <li>
                                Contact Information
                                <table class="form-table">
                                    <tr>
                                        <td>Phone</td>
                                        <td>Email</td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <input type="text" id="phone" placeholder="Phone">
                                        </td>
                                        <td>
                                            <input type="text" id="email" placeholder="Email">
                                        </td>
                                    </tr>
                                </table>
                            </li>
                        </ol>
                        <br>
                        
                        <p align="center">
                            <input type="submit" value="Register">
                        </p>
                    </form>
                </td>
            </tr>
        </table>
    </body>
</html>
